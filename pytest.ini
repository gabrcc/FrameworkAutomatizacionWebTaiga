[pytest]
markers=
    smoke: pruebas de funciones basicas
    regression: pruebas que deben correr en cada ciclo de regresion
    negative: pruebas negativas con datos invalidos o escenarios negativos
    functional: pruebas s funcionalidades del sistema


log_cli = true
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format=%Y-%m-%d %H:%M:%S
log_file = logs/test_log.log
addopts = --html=report.html --self-contained-html --capture=tee-sys